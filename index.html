<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />

    <!-- Google Fonts: DM Serif Display (Editorial Headings) + Manrope (Clean UI & Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Structured Data (Schema.org Organization & LocalBusiness) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["LocalBusiness", "RealEstateAgent"],
      "name": "G&N Investment LLC",
      "legalName": "G&N Investment LLC",
      "url": "https://gninvestmentsky.com/",

      "description": "Local direct real estate buyers in Louisville and across Kentucky. We buy residential properties as-is with no repairs, zero commissions, and flexible closing dates.",
      "telephone": "+1-502-384-3357",
      "priceRange": "$$",
      "areaServed": [
        {
          "@type": "City",
          "name": "Louisville"
        },
        {
          "@type": "AdministrativeArea",
          "name": "Jefferson County"
        },
        {
          "@type": "State",
          "name": "Kentucky"
        }
      ],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Louisville",
        "addressRegion": "KY",
        "addressCountry": "US"
      }
    }
    </script>

    <!-- Tailwind CDN with Brand Tokens -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            colors: {

              copper: "#B56E4D",
              "copper-hover": "#9E5B3D",
              "soft-copper": "#D7AA91",
              "warm-gray": "#6E6B66",

        }
      };
    </script>
  </head>
  <body class="bg-warm-white text-ink antialiased">
    <div id="app" class="relative min-h-screen flex flex-col"></div>
    <script type="module" src="/src/main.js"></script>

</html>
