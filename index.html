    <!-- Base Inline Styles (Architectural Light Palette + Editorial Serif) -->
    <style>
      html {
        margin: 0;
        padding: 0;
        scroll-behavior: smooth;
        overflow-x: hidden;
        overflow-y: auto;
        background-color: #f7f6f2;
        color: #111315;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        background: #f7f6f2;
        color: #111315;
        font-family: 'Newsreader', 'Lora', Georgia, 'Times New Roman', serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-overflow-scrolling: touch;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
      .min-h-screen-safe {
        min-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      }
      main > :first-child {
        margin-top: 0 !important;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @media (prefers-reduced-motion: no-preference) {
        .reveal {
          opacity: 0;
          transform: translateY(24px);
          transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.active {
          opacity: 1;
          transform: translateY(0);
        }
        .delay-100 { transition-delay: 100ms; }
        .delay-200 { transition-delay: 200ms; }
        .delay-300 { transition-delay: 300ms; }
      }
      @media (prefers-reduced-motion: reduce) {
        .reveal {
          opacity: 1;
          transform: none;
          transition: none;
        }
      }
      @keyframes softPulse {
        0% { box-shadow: 0 0 0 0 rgba(184, 138, 118, 0.4); }
        70% { box-shadow: 0 0 0 15px rgba(184, 138, 118, 0); }
        100% { box-shadow: 0 0 0 0 rgba(184, 138, 118, 0); }
      }
      .btn-pulse {
        animation: softPulse 2s infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .btn-pulse { animation: none; }
        .animate-pulse { animation: none !important; }
      }
    </style>
